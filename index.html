<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="M.B. Stiles: engineering portfolio of printable mechanisms and machines, in an interactive 3D gallery.">
<title>M.B. Stiles Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL gallery with a thin HUD. Panels live in a screen-pinned 3D layer rendered over the hall.
   Single deliberate look: a dim exhibition hall, so colours are set explicitly rather than themed. */
:root{
  color-scheme:dark;
  --hall:#0D1012; --ink:#E9EDEB; --dim:#9AA6A1; --rule:rgba(233,237,235,.16);
  --amber:#F2A04A; --glass:rgba(18,23,25,.72);
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--hall);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px 16px;flex-wrap:wrap}
.mark{pointer-events:auto}.mark h1{cursor:pointer;margin:0;font-family:var(--display);font-weight:700;font-size:clamp(24px,3.4vw,36px);line-height:.95;letter-spacing:.02em;text-transform:uppercase}
.mark p{margin:4px 0 0;font-size:13px;color:var(--dim);max-width:44ch}
nav{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
.hb{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink);background:var(--glass);border:1px solid var(--rule);padding:6px 13px;cursor:pointer;backdrop-filter:blur(6px)}
.hb:hover{border-color:var(--amber)}
nav .hb[aria-current="true"]{border-color:var(--amber);color:var(--amber)}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bottom .grp{display:flex;gap:6px;pointer-events:auto}
.arrow{min-width:44px;font-size:18px;padding:4px 12px}
.hint{font-family:var(--mono);font-size:11px;color:var(--dim);flex:1;min-width:0;text-align:center}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--mono);color:var(--dim);padding:16px;text-align:center}
@media (max-width:620px){.mark p{display:none}.hint{display:none}}
</style>

<div id="stage"></div>
<div class="loading" id="loading">Setting up the gallery…</div>
<div class="hud">
  <div class="top" id="hudTop">
  </div>
  <div></div>
  <div class="bottom" id="hudBot">
    <span class="hint" id="hint"></span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(async () => {
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEG = Math.PI / 180;
const COL = { ink:'#E9EDEB', dim:'#9AA6A1', faint:'rgba(233,237,235,.10)', rule:'rgba(233,237,235,.18)', amber:'#F2A04A', teal:'#62C6B8', red:'#E8766B', glass:'rgba(17,22,24,.86)', tile:'rgba(32,40,43,.92)' };
await Promise.all([
  document.fonts.load('700 48px "Barlow Condensed"'), document.fonts.load('600 32px "Barlow Condensed"'),
  document.fonts.load('400 24px "IBM Plex Sans"'), document.fonts.load('400 22px "IBM Plex Mono"')
]).catch(() => {});
const S = await fetch('walker_scene.json').then(r => r.json());

/* ================= renderer: hall scene + screen-pinned UI scene ================= */
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding; renderer.autoClear = false;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0D1012'); scene.fog = new THREE.Fog('#0D1012', 5200, 11000);
const camera = new THREE.PerspectiveCamera(34, 1, 5, 12000);
const ui = new THREE.Scene();
const uiCam = new THREE.PerspectiveCamera(30, 1, 1, 6000);
const DP = 1000;                                    // UI plane distance in front of the UI camera
ui.add(new THREE.HemisphereLight(0xdfe6e3, 0x1a1f21, 0.9));
const uiKey = new THREE.DirectionalLight(0xffffff, 0.8); uiKey.position.set(-300, 500, 900); ui.add(uiKey);

const ambient = new THREE.HemisphereLight(0xb8c4c0, 0x101416, 0.38); scene.add(ambient);
const floor = new THREE.Mesh(new THREE.CircleGeometry(7000, 128), new THREE.MeshStandardMaterial({color:'#15191B', roughness:.85, metalness:.05}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);
for (let r = 700; r <= 5600; r += 700){
  const m = new THREE.Mesh(new THREE.RingGeometry(r, r + 2, 160), new THREE.MeshBasicMaterial({color:'#232A2D'}));
  m.rotation.x = -Math.PI/2; m.position.y = 0.5; scene.add(m);
}

/* ================= canvas helpers ================= */
const PX = 3;  // canvas pixels per panel unit
function rr(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
const FONTS = { display:'700 {}px "Barlow Condensed", sans-serif', label:'600 {}px "Barlow Condensed", sans-serif', body:'400 {}px "IBM Plex Sans", sans-serif', mono:'400 {}px "IBM Plex Mono", monospace' };
function font(ctx, kind, px){ ctx.font = FONTS[kind].replace('{}', px); }
function fit(ctx, kind, text, px, maxW){ font(ctx, kind, px); while (ctx.measureText(text).width > maxW && px > 5){ px -= 0.5; font(ctx, kind, px); } }
function spaced(ctx, text, x, y, sp){ for (const ch of text){ ctx.fillText(ch, x, y); x += ctx.measureText(ch).width + sp; } }
function wrap(ctx, text, x, y, maxW, lh){
  let line = '', yy = y;
  for (const w of text.split(' ')){ const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line){ ctx.fillText(line, x, yy); line = w; yy += lh; } else line = t; }
  if (line) ctx.fillText(line, x, yy); return yy + lh;
}
const lift = (ctx, on) => { ctx.shadowColor = on ? 'rgba(0,0,0,.55)' : 'transparent'; ctx.shadowBlur = on ? 10 : 0; ctx.shadowOffsetY = on ? 4 : 0; };

/* ================= Panel: a slab with stacked canvas layers and real 3D parts at depth ================= */
const PW = 260;
const panels = [];
class Panel {
  constructor(h, opts = {}){
    this.w = opts.w || PW; this.h = h; this.layers = []; this.objs = []; this.sliders = [];
    this.group = new THREE.Group(); this.inner = new THREE.Group(); this.group.add(this.inner);
    this.show = 0; this.target = 0; this.mult = 1; this.multT = 1; this.dim = 0; this.dimT = 0;
    this.tPos = new THREE.Vector3(); this.tQuat = new THREE.Quaternion(); this.tScale = 1; this.placed = false;
    this.slab = new THREE.Mesh(new THREE.BoxGeometry(this.w, this.h, 5), new THREE.MeshStandardMaterial({color:'#182023', roughness:.45, metalness:.25, transparent:true}));
    this.slab.position.z = -2.5; this.slab.userData.panel = this; this.inner.add(this.slab);
    (opts.scene || ui).add(this.group); if (!opts.scene) panels.push(this);
  }
  layer(depth, draw, opts = {}){
    const c = document.createElement('canvas'); c.width = Math.round(this.w * PX); c.height = Math.round(this.h * PX);
    const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding; tex.anisotropy = 8;
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(this.w, this.h), new THREE.MeshBasicMaterial({map:tex, transparent:true, depthWrite:false, toneMapped:false}));
    mesh.renderOrder = 10 + this.layers.length; this.inner.add(mesh);
    const L = { c, ctx:c.getContext('2d'), tex, mesh, depth, draw, live:!!opts.live };
    this.layers.push(L); this.redraw(L); return L;
  }
  obj(o, depth){ this.inner.add(o); this.objs.push({o, depth}); o.traverse(m => { if (m.material){ m.material.transparent = true; } }); return o; }
  at(x, y){ return [x - this.w/2, this.h/2 - y]; }      // canvas coords -> panel-local
  redraw(L){ const x = L.ctx; x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,L.c.width,L.c.height); x.scale(PX, PX); L.draw(x, this.w, this.h); L.tex.needsUpdate = true; }
  redrawAll(){ for (const L of this.layers) this.redraw(L); }
  update(dt, tilt){
    const e = Math.min(1, dt * (reduce ? 40 : 6));
    this.show += (this.target - this.show) * e; this.mult += (this.multT - this.mult) * e; this.dim += (this.dimT - this.dim) * e;
    const s = this.show; this.group.visible = s > 0.01;
    if (s < 0.03 && this.target > 0){ this.group.position.copy(this.tPos); this.group.quaternion.copy(this.tQuat); this.group.scale.setScalar(this.tScale); }
    this.group.position.lerp(this.tPos, e); this.group.quaternion.slerp(this.tQuat, e);
    const sc = this.group.scale.x + (this.tScale - this.group.scale.x) * e; this.group.scale.setScalar(sc);
    const fade = 1 - this.dim * 0.55;
    this.layers.forEach((L, i) => {
      const k = Math.min(1, Math.max(0, s * 1.5 - i * 0.1));
      L.mesh.position.z = 0.3 + L.depth * this.mult * k;
      L.mesh.material.opacity = k * fade;
      if (L.live && s > 0.01) this.redraw(L);
    });
    for (const {o, depth} of this.objs){
      const k = Math.min(1, Math.max(0, s * 1.5 - 0.3));
      o.position.z = depth * this.mult * k;
      o.traverse(m => { if (m.material) m.material.opacity = (m.userData.alpha ?? 1) * k * fade; });
    }
    this.slab.material.opacity = Math.min(1, s * 1.4);
    for (const sl of this.sliders) sl.sync(s * fade, this.mult);
    // idle orbit: down, left, up, right on a slow circle, layered on top of the pointer tilt
    const ia = (tilt && !reduce && !panelFocus) ? 0.9 : 0, it = performance.now() / 1000 * 0.7;
    const tx = (tilt ? tilt.x : 0) - Math.sin(it) * ia, ty = (tilt ? tilt.y : 0) - Math.cos(it) * ia, amp = this.mult > 1.5 ? 0.3 : 0.14;
    this.inner.rotation.y += (tx * amp - this.inner.rotation.y) * 0.08;
    this.inner.rotation.x += (-ty * amp * 0.7 - this.inner.rotation.x) * 0.08;
  }
}
function glass(ctx, w, h){
  ctx.fillStyle = COL.glass; rr(ctx, 0, 0, w, h, 7); ctx.fill();
  ctx.strokeStyle = COL.rule; ctx.lineWidth = 0.6; rr(ctx, .5, .5, w-1, h-1, 7); ctx.stroke();
  ctx.fillStyle = COL.faint; for (let x = 10; x < w; x += 10) for (let y = 10; y < h; y += 10) ctx.fillRect(x, y, .5, .5);   // drafting dot grid
}
function heading(ctx, w, eyebrow, title){
  lift(ctx, true);
  font(ctx, 'label', 8.5); ctx.fillStyle = COL.amber; spaced(ctx, eyebrow.toUpperCase(), 14, 19, 1);
  fit(ctx, 'display', title.toUpperCase(), 19, w - 28); ctx.fillStyle = COL.ink; ctx.fillText(title.toUpperCase(), 14, 38);
  ctx.fillStyle = COL.amber; ctx.fillRect(14, 44, 30, 1.6);
  lift(ctx, false);
}
const glow = (color, e = .35) => new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:e, roughness:.4, metalness:.1});

/* 3D slider: track, fill and knob are meshes at three depths */
const sliderHits = [];
class Slider {
  constructor(panel, x, y, w, label, min, max, value, fmt, onChange){
    Object.assign(this, {panel, x, y, w, label, min, max, value, fmt, onChange});
    const g = new THREE.Group(); const [lx, ly] = panel.at(x, y); g.position.set(lx, ly, 0); panel.inner.add(g); this.g = g;
    this.track = new THREE.Mesh(new THREE.BoxGeometry(w, 2.4, 2), new THREE.MeshStandardMaterial({color:'#323C40', roughness:.6, transparent:true}));
    this.track.position.set(w/2, 0, 0); g.add(this.track);
    this.fill = new THREE.Mesh(new THREE.BoxGeometry(1, 2.8, 3), glow(COL.amber, .45)); this.fill.material.transparent = true; g.add(this.fill);
    this.knob = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 6, 32), new THREE.MeshStandardMaterial({color:'#EDE6DA', roughness:.3, metalness:.15, transparent:true}));
    this.knob.rotation.x = Math.PI/2; g.add(this.knob);
    this.hit = new THREE.Mesh(new THREE.PlaneGeometry(w + 16, 20), new THREE.MeshBasicMaterial({visible:false}));
    this.hit.position.set(w/2, 0, 20); g.add(this.hit); this.hit.userData.slider = this; sliderHits.push(this.hit);
    panel.sliders.push(this); this.place();
  }
  place(){ const t = (this.value - this.min) / (this.max - this.min); this.knob.position.x = t * this.w; this.fill.scale.x = Math.max(.01, t * this.w); this.fill.position.x = t * this.w / 2; }
  setFromLocalX(lx){ const t = Math.min(1, Math.max(0, lx / this.w)); const v = this.min + t * (this.max - this.min); if (v !== this.value){ this.value = v; this.place(); this.onChange(v); } }
  sync(op, mult){ for (const m of [this.track, this.fill, this.knob]) m.material.opacity = op; this.track.position.z = 8 * mult; this.fill.position.z = 10 * mult; this.knob.position.z = 16 * mult; }
}
function sliderLabels(ctx, sliders){
  lift(ctx, true);
  for (const s of sliders){
    font(ctx, 'label', 9); ctx.fillStyle = COL.dim; ctx.textAlign = 'left'; spaced(ctx, s.label.toUpperCase(), s.x, s.y - 9, .6);
    font(ctx, 'mono', 9); ctx.fillStyle = COL.ink; ctx.textAlign = 'right'; ctx.fillText(s.fmt(s.value), s.x + s.w, s.y - 9); ctx.textAlign = 'left';
  }
  lift(ctx, false);
}

/* chart frame shared by the line charts: plot rect in canvas units */
function chartRect(w, h){ return { L:34, R:w - 16, T:62, B:h - 26 }; }
function tube(panel, pts2d, radius, material){
  // pts2d in canvas units -> a tube in panel-local space
  const v = pts2d.map(([x, y]) => { const [lx, ly] = panel.at(x, y); return new THREE.Vector3(lx, ly, 0); });
  if (v.length < 2) return new THREE.Group();
  const curve = new THREE.CatmullRomCurve3(v, false, 'centripetal');
  return new THREE.Mesh(new THREE.TubeGeometry(curve, Math.min(400, v.length * 2), radius, 8, false), material);
}
function areaMesh(panel, pts2d, baseY, color, alpha){
  const shape = new THREE.Shape();
  const first = panel.at(pts2d[0][0], baseY); shape.moveTo(first[0], first[1]);
  for (const [x, y] of pts2d){ const [lx, ly] = panel.at(x, y); shape.lineTo(lx, ly); }
  const last = panel.at(pts2d[pts2d.length-1][0], baseY); shape.lineTo(last[0], last[1]);
  const m = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({color, transparent:true, opacity:alpha, side:THREE.DoubleSide, depthWrite:false}));
  m.userData.alpha = alpha; return m;
}
function marker(color){
  const g = new THREE.Group();
  const ball = new THREE.Mesh(new THREE.SphereGeometry(4, 24, 16), glow(color, .8)); g.add(ball);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.5, .5, 1, 8), new THREE.MeshBasicMaterial({color, transparent:true, opacity:.6}));
  stem.rotation.x = Math.PI/2; stem.userData.alpha = .6; g.add(stem);
  g.userData.ball = ball; g.userData.stem = stem; return g;
}
function placeMarker(panel, m, x, y, depth){
  const [lx, ly] = panel.at(x, y); const d = depth * panel.mult;
  m.position.set(lx, ly, 0); m.userData.ball.position.z = d; m.userData.stem.scale.y = Math.max(.01, d); m.userData.stem.position.z = d / 2;
}

/* ================= hall: pedestals, spots, title plates ================= */
function pedestal(x, z, r, h, flare = 1.04){
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(r, r * flare, h, 96), new THREE.MeshStandardMaterial({color:'#1E2427', roughness:.7, metalness:.1}));
  body.position.y = h/2; body.receiveShadow = body.castShadow = true; g.add(body);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(r, 1.6, 8, 96), glow(COL.amber, .25)); lip.rotation.x = Math.PI/2; lip.position.y = h; g.add(lip);
  return {g, top:h, lip};
}
function spot(x, z, target, angle){
  const s = new THREE.SpotLight(0xFFC266, 1.0, 0, angle, 0.45, 1.2);   // warm gold
  s.position.set(x, 2300, z + 600); s.target = target; s.castShadow = true;
  s.shadow.mapSize.set(1024, 1024); s.shadow.bias = -0.0004; s.shadow.camera.near = 500; s.shadow.camera.far = 4000;
  scene.add(s); scene.add(target);
  s.userData.beam = makeBeam(); return s;
}
/* visible light shaft: an open cone from the lamp to the floor, additive, brightest near the lamp and soft at its edges */
const BEAM_GEO = new THREE.ConeGeometry(1, 1, 64, 1, true); BEAM_GEO.translate(0, -0.5, 0);   // apex at the origin, base at y = -1
function makeBeam(){
  const m = new THREE.ShaderMaterial({
    uniforms:{ uColor:{value:new THREE.Color(0xFFC266)}, uI:{value:0} },
    vertexShader:`varying float vAlong; varying vec3 vN; varying vec3 vV;
      void main(){ vAlong = -position.y; vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader:`uniform vec3 uColor; uniform float uI; varying float vAlong; varying vec3 vN; varying vec3 vV;
      void main(){ float edge = pow(abs(dot(normalize(vN), normalize(vV))), 1.6);
        float fall = (1.0 - vAlong) * 0.8 + 0.2; float a = uI * edge * fall * smoothstep(0.0, 0.06, vAlong) * 0.16;
        gl_FragColor = vec4(uColor * a, a); }`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide
  });
  const beam = new THREE.Mesh(BEAM_GEO, m); beam.renderOrder = 5; beam.frustumCulled = false; scene.add(beam); return beam;
}
const _dn = new THREE.Vector3(0, -1, 0), _bd = new THREE.Vector3();
function updateBeam(s){
  const b = s.userData.beam; _bd.copy(s.target.position).sub(s.position).normalize();
  const len = s.position.y / Math.max(.2, -_bd.y), r = len * Math.tan(s.angle) * .92;
  b.position.copy(s.position); b.quaternion.setFromUnitVectors(_dn, _bd); b.scale.set(r, len, r);
  b.material.uniforms.uI.value = s.intensity / 3; b.visible = s.intensity > .02;
}
function titlePlate(text, sub){
  const p = new Panel(56, {w:240, scene});
  p.layer(0, (ctx, w, h) => { ctx.fillStyle = COL.glass; rr(ctx, 0, 0, w, h, 6); ctx.fill(); ctx.strokeStyle = COL.rule; ctx.lineWidth = .6; rr(ctx,.5,.5,w-1,h-1,6); ctx.stroke(); });
  p.layer(6, (ctx, w) => { lift(ctx, true); fit(ctx, 'display', text.toUpperCase(), 21, w - 40); ctx.fillStyle = COL.ink; ctx.fillText(text.toUpperCase(), 12, 29); font(ctx, 'mono', 8); ctx.fillStyle = COL.dim; ctx.fillText(sub, 12, 45); });
  p.layer(12, (ctx, w) => { ctx.fillStyle = COL.amber; ctx.fillRect(w - 20, 14, 7, 7); });
  p.target = 1; p.group.scale.setScalar(2.6); p.tScale = 2.6; return p;
}

/* ================= Exhibit: Strandbeest walker ================= */
const WK = S.walker, PITCH = S.pitch, T = S.T, H = S.scale, SIGNS = [-1, 1, -1, -1, -1];
const PH = WK.phases_deg.map(d => d * DEG);
function circ(p0, r0, p1, r1, s){
  const dx=p1[0]-p0[0], dy=p1[1]-p0[1], d=Math.hypot(dx,dy);
  if(!d || d>r0+r1 || d<Math.abs(r0-r1)) return null;
  const a=(r0*r0-r1*r1+d*d)/(2*d), h=Math.sqrt(Math.max(0,r0*r0-a*a)), mx=p0[0]+a*dx/d, my=p0[1]+a*dy/d;
  return [mx - s*h*dy/d, my + s*h*dx/d];
}
function leg(th){
  const Z=[-H.a,-H.l], C=[H.m*Math.cos(th), H.m*Math.sin(th)];
  const P1=circ(C,H.j,Z,H.b,SIGNS[0]), P2=circ(C,H.k,Z,H.c,SIGNS[1]);
  const P3=circ(P1,H.e,Z,H.d,SIGNS[2]), P4=circ(P3,H.f,P2,H.g,SIGNS[3]), F=circ(P4,H.h,P2,H.i,SIGNS[4]);
  return {O:[0,0], Z, C, P1, P2, P3, P4, F};
}
const PART_COLOR = { crank:'#D9822B', link_c:'#3C78AE', link_k:'#5DA9D6', link_j:'#2A9A86', upper:'#7F68C2', link_f:'#C9475A', foot:'#E2B034' };
function bufGeom(mesh){ const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(mesh.v, 3)); g.setIndex(mesh.f); g.computeVertexNormals(); return g; }
const GM = {};
for (const [n,p] of Object.entries(S.parts)) GM[n] = bufGeom(p.mesh);
for (const [n,p] of Object.entries(S.types)) GM[n] = bufGeom(p.mesh);
for (const [n,p] of Object.entries(S.walker_meshes)) GM[n] = bufGeom(p);
const MATS = {};
const mat = (id, color) => MATS[id] || (MATS[id] = new THREE.MeshStandardMaterial({color, roughness:.55, metalness:.08, flatShading:true}));
function solid(g, id, color){ const m = new THREE.Mesh(g, mat(id, color)); m.castShadow = m.receiveShadow = true; return m; }
const STEEL = '#A2ABAF', FRAME = '#59625E';
const longKey = Object.keys(S.walker_meshes).find(k => k.startsWith('pin_C_long'));
const soKey = Object.keys(S.walker_meshes).find(k => k.startsWith('standoff'));
const spacer3 = Object.keys(S.types).find(k => k.startsWith('spacer_13.2'));
let lowY = 0; for (let i=0;i<360;i++) lowY = Math.min(lowY, leg(i*DEG).F[1]);

const exhibits = [];
function makeExhibit(def){
  const pivot = new THREE.Group(); pivot.position.copy(def.center); scene.add(pivot);
  def.yaw0 = def.yaw || 0; def.cy = def.center.y; def.center = def.center.clone();
  const e = Object.assign({ pivot, rest:new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), def.yaw || 0), user:new THREE.Quaternion(), zoom:1, deck:[] }, def);
  pivot.quaternion.copy(e.rest);
  e.title = titlePlate(def.titleText, def.titleSub); e.title.group.position.set(def.center.x, def.titleY, def.center.z); e.title.tPos.copy(e.title.group.position);
  const hit = new THREE.Mesh(new THREE.CylinderGeometry(def.hitR, def.hitR, 760, 24), new THREE.MeshBasicMaterial({visible:false}));
  hit.position.set(def.center.x, 380, def.center.z); hit.userData.exhibit = e; scene.add(hit); e.hit = hit;
  e.deck = def.panels.map((_, i) => i);
  exhibits.push(e); return e;
}

const ped1 = pedestal(0, 0, 420, 120);
const W1 = new THREE.Vector3(0, ped1.top + 150, 0);
const walker = new THREE.Group(); walker.position.set(0, ped1.top - lowY + 1 - W1.y, 0);
function buildSide(parent, isFront, longC){
  const g = new THREE.Group(); parent.add(g);
  const side = { g, parts:{}, hw:[] };
  for (const name of Object.keys(PART_COLOR)){ const m = solid(GM[name], name, PART_COLOR[name]); g.add(m); side.parts[name] = m; }
  for (const h of S.hardware){
    if (h.side === 'both' && !isFront) continue;
    const t = S.types[h.type];
    if (longC && h.joint === 'C' && t.kind === 'pin') continue;
    const m = solid(GM[h.type], 'steel', STEEL); m.userData = {hw:h, kind:t.kind, len:t.length}; g.add(m); side.hw.push(m);
    if (h.collar){ const c = solid(GM.collar, 'steel', STEEL); c.userData = {hw:h, kind:'collar'}; g.add(c); side.hw.push(c); }
  }
  if (longC){
    const p = solid(GM[longKey], 'steel', STEEL); p.userData = {kind:'longC'}; g.add(p); side.hw.push(p);
    const s = solid(GM[spacer3], 'steel', STEEL); s.userData = {kind:'spacerC', len:S.types[spacer3].length}; g.add(s); side.hw.push(s);
  }
  if (!isFront) g.rotation.y = Math.PI;
  return side;
}
const modules = [];
for (let i = 0; i < 4; i++){
  const mg = new THREE.Group(); walker.add(mg);
  const mod = { g:mg, z:WK.zs[i], phase:PH[i], front:buildSide(mg, true, true), back:buildSide(mg, false, i < 3) };
  mod.frame = solid(GM.frame_walker, 'frame', FRAME); mg.add(mod.frame); modules.push(mod);
}
const webs = WK.webs.map(w => { const m = solid(GM[w.type], 'web', '#C9CED0'); m.userData.w = w; walker.add(m); return m; });
const drive = solid(GM.drive_crank, 'crank', PART_COLOR.crank); walker.add(drive);
const standoffs = [];
for (let i = 0; i < 3; i++) for (const xy of WK.standoffs){ const m = solid(GM[soKey], 'frame', FRAME); m.userData = {gap:i, xy}; walker.add(m); standoffs.push(m); }
const wState = { theta:0, speed:1.0, explode:0 };
const zx = z => z * (1 + 2.4 * wState.explode);
function placeSide(side, th){
  const P = leg(th);
  for (const [name, m] of Object.entries(side.parts)){
    const js = Object.keys(S.parts[name].joints), a = P[js[0]], b = P[js[1]];
    m.position.set(a[0], a[1], zx(S.parts[name].layer * PITCH) - T/2); m.rotation.set(0, 0, Math.atan2(b[1]-a[1], b[0]-a[0]));
  }
  const up = wState.explode * 50;
  for (const m of side.hw){
    const u = m.userData, kind = u.kind;
    if (kind === 'longC'){ m.position.set(P.C[0], P.C[1], zx(WK.crank_bot)); m.scale.z = (zx(WK.crank_bot + WK.long_c) - zx(WK.crank_bot)) / WK.long_c; continue; }
    if (kind === 'spacerC'){ m.position.set(P.C[0], P.C[1], zx(6*PITCH) - u.len/2); continue; }
    const h = u.hw, p = P[h.joint], zc = zx((h.z0 + h.z1)/2), half = (h.z1 - h.z0)/2;
    m.rotation.set(0,0,0); m.scale.set(1,1,1);
    if (kind === 'pin'){ m.rotation.x = Math.PI; m.position.set(p[0], p[1], zc + half + 2 + up); }
    else if (kind === 'collar') m.position.set(p[0], p[1], zx(h.z0) - 2.2 - up * .6);
    else if (kind === 'spacer') m.position.set(p[0], p[1], zc - u.len/2);
    else if (kind === 'shaft'){ m.position.set(0, 0, zx(h.z0)); m.scale.z = (zx(h.z1) - zx(h.z0)) / u.len; }
  }
}
function placeWalker(){
  const th0 = wState.theta;
  modules.forEach(mod => { const th = th0 + mod.phase; mod.g.position.z = zx(mod.z); mod.frame.position.z = -T/2; placeSide(mod.front, th); placeSide(mod.back, Math.PI - th); });
  webs.forEach(m => { const w = m.userData.w; m.position.set(0, 0, zx(w.z) - T/2); m.rotation.set(0, 0, th0 + PH[w.gap]); });
  drive.position.set(0, 0, zx(WK.zs[0] + WK.web_z) - T/2 + wState.explode * 40); drive.rotation.set(0, 0, th0 + PH[0]);
  standoffs.forEach(m => { const {gap:i, xy:[x,y]} = m.userData; const z0 = zx(WK.zs[i+1]) + T/2, z1 = zx(WK.zs[i]) - T/2; m.position.set(x, y, z0); m.scale.z = (z1 - z0) / WK.standoff_len; });
}

  x.fillStyle = '#F2A04A'; x.font = '600 26px "Barlow Condensed", sans-serif'; x.fillText('MC-5  AUTO', 20, 38);

}
let hmiT0 = 0;
function cellTick(dt, active){
  if (!active) return;
  const h = Math.min(dt, .05) * mk8.speed, n = Math.ceil(h / .02);
  for (let i = 0; i < n; i++) simStep(h / n);

// cost: cost per motor vs annual volume, cell vs manual benches
const mcCost = new Panel(246);
const CR = { L:40, R:PW - 14, T:62, B:180 };
const cv = CM.cost_curve, cmaxV = 1.6e6, cmaxC = 1.6;
const ccx = v => CR.L + (v - 1e5) / (cmaxV - 1e5) * (CR.R - CR.L), ccy = c => CR.B - Math.min(cmaxC, c) / cmaxC * (CR.B - CR.T);
function cellCost(v){ const c = CM.cost, hrs = hoursYr(), cap = capYr(), good = Math.min(v, cap), cx_ = capex();
  const annual = cx_ / c.depreciation_years + cx_ * c.maintenance_frac + c.labour_rate * c.operators_per_shift * hrs + c.kW * hrs * c.power_rate + c.floor_m2 * c.floor_rate;
  return (annual + (1 - CM.yield.rty) * 2.1 * good) / Math.max(good, 1); }
function manCost(v){ const c = CM.cost, m = c.manual, hrs = hoursYr(), cap = m.operators * hrs * 3600 / m.cycle_s * .92, benches = Math.ceil(v / cap * m.operators);
  return (benches * c.labour_rate * hrs + m.fixtures_capex * benches / m.operators / c.depreciation_years + (1 - m.fpy) * 2.1 * v) / v; }

  ctx.textAlign = 'center'; for (const v of [2e5, 6e5, 1e6, 1.4e6]) ctx.fillText(fmtK(v), ccx(v), CR.B + 11); ctx.textAlign = 'left';
  const line = (f, col, lw) => { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); for (let v = 1e5; v <= cmaxV; v += 2.5e4){ const x = ccx(v), y = ccy(f(v)); v === 1e5 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke(); };

  const M = GV().motion, t = M.th, n = t.length; const u = (th - t[0]) / (t[n - 1] - t[0]) * (n - 1), i = Math.max(0, Math.min(n - 2, Math.floor(u))), f = u - i;

function placeGeneva(){
